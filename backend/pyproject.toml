# Tool configuration only; dependencies live in requirements*.txt so the
# Docker layer cache can key on them directly.

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S", "ASYNC"]
ignore = [
  "B008",  # FastAPI's Depends() in defaults is idiomatic
  "S101",  # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # hard-coded test passwords
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
